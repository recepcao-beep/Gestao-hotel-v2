name: Ping Supabase

on:
  schedule:
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase via App API
        run: |
          curl -sS "https://gestao-hotel.vercel.app/api/health"
          curl -sS "https://gestao-hotel.vercel.app/api/sheets/load?hotel=VILLAGE&nocache=$(date +%s)"