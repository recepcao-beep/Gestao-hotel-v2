name: OBS - Teste de Escrita Temporaria

on:
  workflow_dispatch:

jobs:
  obs-escrita-teste:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ROBOT_HEADLESS: "1"
      HITS_EMAIL: ${{ secrets.HITS_EMAIL }}
      HITS_PASSWORD: ${{ secrets.HITS_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Identificar codigo
        run: |
          git rev-parse HEAD
          git log -1 --oneline
          git status --short

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r robots/vinculacao/requirements.txt
          python -m pip install pytest

      - name: Preparar credenciais temporarias
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          arquivos = {
              "GOOGLE_SERVICE_ACCOUNT_JSON": Path("robots/vinculacao/automacao-mapinha-cb0bced39056.json"),
              "GOOGLE_OAUTH_CLIENT_SECRET_JSON": Path("robots/vinculacao/client_secret.json"),
              "GOOGLE_OAUTH_TOKEN_JSON": Path("robots/vinculacao/token.json"),
          }
          for nome_env, caminho in arquivos.items():
              valor = os.environ.get(nome_env, "")
              if not valor.strip():
                  raise SystemExit(f"{nome_env} ausente ou vazio.")
              json.loads(valor)
              caminho.parent.mkdir(parents=True, exist_ok=True)
              caminho.write_text(valor, encoding="utf-8")
              if caminho.stat().st_size <= 0:
                  raise SystemExit(f"Arquivo temporario vazio: {caminho}")
              json.loads(caminho.read_text(encoding="utf-8"))
              print(f"Arquivo temporario criado e validado: {caminho}")

          if not os.environ.get("HITS_EMAIL", "").strip():
              raise SystemExit("HITS_EMAIL ausente ou vazio.")
          if not os.environ.get("HITS_PASSWORD", "").strip():
              raise SystemExit("HITS_PASSWORD ausente ou vazio.")
          print("Secrets obrigatorios presentes.")
          PY

      - name: Validacao estatica
        run: |
          python -m py_compile \
            robots/vinculacao/obs.py \
            robots/vinculacao/testar_escrita_obs.py
          python -m pytest \
            tests/test_obs_diagnostico.py \
            tests/test_escrita_obs.py \
            -v

      - name: Extracao segura do HITS
        run: |
          python robots/vinculacao/obs.py \
            --diagnostico \
            --dias 7 \
            --no-write \
            --headless 1 \
            --exportar-linhas artifacts/verificacao_diaria/obs_linhas_extraidas.json

      - name: Validar artifact extraido
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          caminho = Path("artifacts/verificacao_diaria/obs_linhas_extraidas.json")
          if not caminho.exists():
              raise SystemExit("Artifact de linhas extraidas nao encontrado.")
          payload = json.loads(caminho.read_text(encoding="utf-8"))
          linhas = payload.get("linhas_extraidas", [])
          normalizadas = [[str(celula or "").strip() for celula in (linha[:6] + [""] * (6 - len(linha[:6])))] for linha in linhas]
          hash_recalculado = hashlib.sha256(
              json.dumps(normalizadas, ensure_ascii=False, sort_keys=True).encode("utf-8")
          ).hexdigest()
          datas = sorted({linha[0] for linha in normalizadas if linha and linha[0]})
          if payload.get("schema_version") != 1:
              raise SystemExit("schema_version invalido.")
          if payload.get("hash_linhas") != hash_recalculado:
              raise SystemExit("Hash do artifact divergente.")
          if payload.get("quantidade_registros") != len(normalizadas):
              raise SystemExit("Quantidade do artifact divergente.")
          if len(datas) != 7:
              raise SystemExit(f"Quantidade de datas invalida: {len(datas)}")
          print(f"Artifact validado: {caminho}")
          print(f"Tamanho bytes: {caminho.stat().st_size}")
          print(f"Quantidade registros: {len(normalizadas)}")
          print(f"Datas: {', '.join(datas)}")
          print(f"Hash artifact: {hash_recalculado}")
          PY

      - name: Testar escrita temporaria
        run: |
          python robots/vinculacao/testar_escrita_obs.py \
            --arquivo-dados artifacts/verificacao_diaria/obs_linhas_extraidas.json

      - name: Verificar e aprovar artifacts
        id: scan_artifacts
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          rm -rf artifacts_upload
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          base = Path("artifacts/verificacao_diaria")
          destino = Path("artifacts_upload")
          padroes = ["*.json", "*.txt", "*.log", "*.png"]
          proibidos = [
              "HITS_EMAIL",
              "HITS_PASSWORD",
              os.environ.get("HITS_EMAIL", ""),
              os.environ.get("HITS_PASSWORD", ""),
              os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON", ""),
              os.environ.get("GOOGLE_OAUTH_CLIENT_SECRET_JSON", ""),
              os.environ.get("GOOGLE_OAUTH_TOKEN_JSON", ""),
              "GOOGLE_SERVICE_ACCOUNT_JSON",
              "GOOGLE_OAUTH_CLIENT_SECRET_JSON",
              "GOOGLE_OAUTH_TOKEN_JSON",
              "client_secret",
              "refresh_token",
              "access_token",
              "private_key",
              "private_key_id",
              "Authorization",
              "Bearer",
              "Cookie:",
              "Set-Cookie:",
              "sessionid",
              "authorized_user",
              "service_account",
          ]
          proibidos = [valor for valor in proibidos if str(valor).strip()]
          arquivos = []
          for padrao in padroes:
              arquivos.extend(sorted(base.glob(padrao)))
          for caminho in arquivos:
              conteudo = caminho.read_bytes()
              if any(str(proibido).encode("utf-8") in conteudo for proibido in proibidos):
                  raise SystemExit(f"Artifact bloqueado por conteudo sensivel: {caminho.name}")
              texto = conteudo.decode("utf-8", errors="ignore")
              texto_lower = texto.lower()
              if "client_id" in texto_lower and ("oauth" in texto_lower or "client_secret" in texto_lower):
                  raise SystemExit(f"Artifact bloqueado por conteudo sensivel: {caminho.name}")
              if any(nome in caminho.name.lower() for nome in ("client_secret", "token", "credential", "service_account")):
                  raise SystemExit(f"Artifact bloqueado por conteudo sensivel: {caminho.name}")

          destino.mkdir(parents=True, exist_ok=True)
          for caminho in arquivos:
              shutil.copy2(caminho, destino / caminho.name)
          print(f"Artifacts aprovados para upload: {len(arquivos)}")
          PY

      - name: Remover credenciais temporarias
        if: always()
        run: |
          rm -f robots/vinculacao/client_secret.json
          rm -f robots/vinculacao/token.json
          rm -f robots/vinculacao/automacao-mapinha-cb0bced39056.json
          test ! -f robots/vinculacao/client_secret.json
          test ! -f robots/vinculacao/token.json
          test ! -f robots/vinculacao/automacao-mapinha-cb0bced39056.json
          echo "Credenciais temporarias removidas."

      - name: Upload artifacts
        if: ${{ always() && steps.scan_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: obs-escrita-teste-${{ github.run_id }}
          path: artifacts_upload/
          if-no-files-found: warn
