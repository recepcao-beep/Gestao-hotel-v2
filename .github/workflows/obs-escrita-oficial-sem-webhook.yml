name: OBS - Validacao Oficial Sem Webhook

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Digite ESCREVER_SOLICITACOES_SEM_WEBHOOK"
        required: true
        type: string

jobs:
  obs-escrita-oficial-sem-webhook:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ROBOT_HEADLESS: "1"
      HITS_EMAIL: ${{ secrets.HITS_EMAIL }}
      HITS_PASSWORD: ${{ secrets.HITS_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar confirmacao manual
        run: |
          if [ "${{ inputs.confirmacao }}" != "ESCREVER_SOLICITACOES_SEM_WEBHOOK" ]; then
            echo "Confirmacao invalida."
            exit 1
          fi
          echo "Confirmacao manual validada."

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Identificar codigo
        run: |
          git rev-parse HEAD
          git log -1 --oneline
          git status --short

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r robots/vinculacao/requirements.txt
          python -m pip install pytest

      - name: Testes
        run: |
          python -m py_compile \
            robots/vinculacao/obs.py \
            robots/vinculacao/testar_escrita_obs.py \
            robots/vinculacao/testar_escrita_obs_oficial.py
          python -m pytest tests -q

      - name: Criar credenciais temporarias
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          arquivos = {
              "GOOGLE_SERVICE_ACCOUNT_JSON": Path("robots/vinculacao/automacao-mapinha-cb0bced39056.json"),
              "GOOGLE_OAUTH_CLIENT_SECRET_JSON": Path("robots/vinculacao/client_secret.json"),
              "GOOGLE_OAUTH_TOKEN_JSON": Path("robots/vinculacao/token.json"),
          }
          for nome_env, caminho in arquivos.items():
              valor = os.environ.get(nome_env, "")
              if not valor.strip():
                  raise SystemExit(f"{nome_env} ausente ou vazio.")
              json.loads(valor)
              caminho.parent.mkdir(parents=True, exist_ok=True)
              caminho.write_text(valor, encoding="utf-8")
              json.loads(caminho.read_text(encoding="utf-8"))
              print(f"Arquivo temporario criado e validado: {caminho}")

          if not os.environ.get("HITS_EMAIL", "").strip():
              raise SystemExit("HITS_EMAIL ausente ou vazio.")
          if not os.environ.get("HITS_PASSWORD", "").strip():
              raise SystemExit("HITS_PASSWORD ausente ou vazio.")
          print("Secrets obrigatorios presentes.")
          PY

      - name: Extrair OBS sem escrita
        run: |
          python robots/vinculacao/obs.py \
            --diagnostico \
            --dias 7 \
            --no-write \
            --headless 1 \
            --exportar-linhas artifacts/verificacao_diaria/obs_linhas_extraidas.json

      - name: Confirmar extracao sem erros reais
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          caminho = Path("artifacts/verificacao_diaria/obs_linhas_extraidas.json")
          if not caminho.exists():
              raise SystemExit("Artifact de linhas extraidas nao encontrado.")
          payload = json.loads(caminho.read_text(encoding="utf-8"))
          metricas = payload.get("metricas_por_data", [])
          erros = sum(int(metrica.get("erros_reais_extracao", metrica.get("erros_extracao", 0)) or 0) for metrica in metricas)
          if erros != 0:
              raise SystemExit(f"Extracao possui erros reais: {erros}")
          if payload.get("schema_version") != 1:
              raise SystemExit("schema_version invalido.")
          if payload.get("quantidade_registros") != len(payload.get("linhas_extraidas", [])):
              raise SystemExit("Quantidade do artifact divergente.")
          print(f"Erros reais de extracao: {erros}")
          print(f"Quantidade registros: {payload.get('quantidade_registros')}")
          print(f"Hash artifact: {payload.get('hash_linhas')}")
          PY

      - name: Escrita oficial sem webhook
        run: |
          python robots/vinculacao/testar_escrita_obs_oficial.py \
            --arquivo-dados artifacts/verificacao_diaria/obs_linhas_extraidas.json \
            --confirmacao "${{ inputs.confirmacao }}"

      - name: Remover credenciais temporarias
        if: always()
        run: |
          rm -f robots/vinculacao/client_secret.json
          rm -f robots/vinculacao/token.json
          rm -f robots/vinculacao/automacao-mapinha-cb0bced39056.json
          test ! -f robots/vinculacao/client_secret.json
          test ! -f robots/vinculacao/token.json
          test ! -f robots/vinculacao/automacao-mapinha-cb0bced39056.json
          echo "Credenciais temporarias removidas."

      - name: Varrer artifacts aprovados
        id: scan_artifacts
        if: always()
        run: |
          rm -rf artifacts_upload
          python - <<'PY'
          import shutil
          from pathlib import Path

          base = Path("artifacts/verificacao_diaria")
          destino = Path("artifacts_upload")
          padroes = ["*.json", "*.txt", "*.log", "*.png"]
          proibidos = [
              "HITS_EMAIL",
              "HITS_PASSWORD",
              "GOOGLE_SERVICE_ACCOUNT_JSON",
              "GOOGLE_OAUTH_CLIENT_SECRET_JSON",
              "GOOGLE_OAUTH_TOKEN_JSON",
              "client_secret",
              "refresh_token",
              "access_token",
              "private_key",
              "private_key_id",
              "Authorization",
              "Bearer",
              "Cookie:",
              "Set-Cookie:",
              "sessionid",
              "authorized_user",
              "service_account",
          ]
          arquivos = []
          for padrao in padroes:
              arquivos.extend(sorted(base.glob(padrao)))
          for caminho in arquivos:
              conteudo = caminho.read_bytes()
              if any(proibido.encode("utf-8") in conteudo for proibido in proibidos):
                  raise SystemExit(f"Artifact bloqueado por conteudo sensivel: {caminho.name}")
              if any(nome in caminho.name.lower() for nome in ("client_secret", "token", "credential", "service_account")):
                  raise SystemExit(f"Artifact bloqueado por nome sensivel: {caminho.name}")

          destino.mkdir(parents=True, exist_ok=True)
          for caminho in arquivos:
              shutil.copy2(caminho, destino / caminho.name)
          print(f"Artifacts aprovados para upload: {len(arquivos)}")
          PY

      - name: Upload artifacts
        if: ${{ always() && steps.scan_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: obs-escrita-oficial-sem-webhook-${{ github.run_id }}
          path: artifacts_upload/
          if-no-files-found: warn
