name: Robos HITS - Teste Manual

on:
  workflow_dispatch:
    inputs:
      robo:
        description: Robo para executar
        required: true
        type: choice
        options:
          - limpeza
          - mr
          - obs
          - vinc2
      confirmacao:
        description: Digite EXECUTAR_ROBO_HITS para confirmar
        required: true
        type: string

concurrency:
  group: robos-hits-operacionais
  cancel-in-progress: false

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ROBOT_HEADLESS: "1"
      HITS_EMAIL: ${{ secrets.HITS_EMAIL }}
      HITS_PASSWORD: ${{ secrets.HITS_PASSWORD }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Validar confirmacao
        if: ${{ inputs.confirmacao != 'EXECUTAR_ROBO_HITS' }}
        run: |
          echo "Confirmacao invalida."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar Chrome
        run: |
          google-chrome --version || chromium-browser --version || chromium --version

      - name: Executar limpeza
        if: ${{ inputs.robo == 'limpeza' }}
        run: python robots/vinculacao/limpeza.py --headless --pausa-rolagem 1.0 --pausa-acao 1.0

      - name: Executar MR
        if: ${{ inputs.robo == 'mr' }}
        run: python robots/vinculacao/mr.py --headless --fator-pausa 0.5

      - name: Executar OBS
        if: ${{ inputs.robo == 'obs' }}
        run: python robots/vinculacao/obs.py --headless --fator-pausa 0.7

      - name: Executar VINC2
        if: ${{ inputs.robo == 'vinc2' }}
        run: python robots/vinculacao/vinc2.py --headless --fator-pausa 0.8
