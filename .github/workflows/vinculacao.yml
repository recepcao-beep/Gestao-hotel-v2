name: Robos HITS
run-name: ${{ inputs.rotina }} - ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      rotina:
        description: Rotina para executar
        required: true
        default: verificacao_diaria
        type: choice
        options:
          - verificacao_diaria
          - vinculacao_semanal

concurrency:
  group: robos-hits-operacionais
  cancel-in-progress: false

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ROBOT_HEADLESS: "1"
      HITS_EMAIL: ${{ secrets.HITS_EMAIL }}
      HITS_PASSWORD: ${{ secrets.HITS_PASSWORD }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar Chrome
        run: |
          google-chrome --version || chromium-browser --version || chromium --version

      - name: Executar verificacao diaria
        if: ${{ inputs.rotina == 'verificacao_diaria' }}
        run: |
          python robots/vinculacao/mr.py --headless --fator-pausa 0.5
          python robots/vinculacao/obs.py --headless --fator-pausa 0.7
          python robots/vinculacao/vinc2.py --headless --fator-pausa 0.8

      - name: Executar vinculacao semanal
        if: ${{ inputs.rotina == 'vinculacao_semanal' }}
        run: |
          python robots/vinculacao/limpeza.py --headless --pausa-rolagem 1.0 --pausa-acao 1.0
          python robots/vinculacao/mr.py --headless --fator-pausa 0.5
          python robots/vinculacao/obs.py --headless --fator-pausa 0.7
          python robots/vinculacao/vinc2.py --headless --fator-pausa 0.8
