name: Robos HITS
run-name: ${{ inputs.rotina }} - ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      rotina:
        description: Rotina para executar
        required: true
        default: verificacao_diaria
        type: choice
        options:
          - verificacao_diaria
          - vinculacao_semanal

concurrency:
  group: robos-hits-operacionais
  cancel-in-progress: false

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ROBOT_HEADLESS: "1"
      ROBOT_RETRIES: "3"
      ROBOT_RETRY_SLEEP: "20"
      PERMITIR_CLIQUE_OVERBOOKING: "0"
      HITS_EMAIL: ${{ secrets.HITS_EMAIL }}
      HITS_PASSWORD: ${{ secrets.HITS_PASSWORD }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r robots/vinculacao/requirements.txt

      - name: Validar robos
        run: |
          python -m py_compile \
            robots/vinculacao/limpeza.py \
            robots/vinculacao/mr.py \
            robots/vinculacao/obs.py \
            robots/vinculacao/vinc2.py \
            robots/vinculacao/run.py

      - name: Verificar Chrome
        run: |
          google-chrome --version || chromium-browser --version || chromium --version

      - name: Executar verificacao diaria
        if: ${{ inputs.rotina == 'verificacao_diaria' }}
        run: python robots/vinculacao/run.py verificacao_diaria --headless

      - name: Executar vinculacao semanal
        if: ${{ inputs.rotina == 'vinculacao_semanal' }}
        run: python robots/vinculacao/run.py vinculacao_semanal --headless
