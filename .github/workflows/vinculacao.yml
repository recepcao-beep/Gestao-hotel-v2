name: Robos HITS
run-name: ${{ inputs.rotina }} - ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      rotina:
        description: Rotina para executar
        required: true
        default: verificacao_diaria
        type: choice
        options:
          - verificacao_diaria
          - vinculacao_semanal
          - mapa
          - checkin_whatsapp

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ROBOT_HEADLESS: "1"
      HITS_EMAIL: ${{ secrets.HITS_EMAIL }}
      HITS_PASSWORD: ${{ secrets.HITS_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r robots/vinculacao/requirements.txt

      - name: Preparar credenciais temporarias
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          test -n "$HITS_EMAIL"
          test -n "$HITS_PASSWORD"
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON"
          test -n "$GOOGLE_OAUTH_CLIENT_SECRET_JSON"
          test -n "$GOOGLE_OAUTH_TOKEN_JSON"
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > robots/vinculacao/automacao-mapinha-cb0bced39056.json
          printf '%s' "$GOOGLE_OAUTH_CLIENT_SECRET_JSON" > robots/vinculacao/client_secret.json
          printf '%s' "$GOOGLE_OAUTH_TOKEN_JSON" > robots/vinculacao/token.json

      - name: Executar rotina
        run: python robots/vinculacao/run.py "${{ inputs.rotina }}"
