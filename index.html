<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#26A6A6">
    <meta name="application-name" content="Gestão hotel">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Gestão hotel">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#26A6A6',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            transition: background-color 0.3s ease;
        }
        
        /* Global Dark Mode Refinements */
        .dark body { 
            background-color: #0f172a; /* bg-slate-900 */
        }
        
        .dark .bg-white {
            background-color: #1e293b !important; /* bg-slate-800 */
            color: #f1f5f9 !important;
        }
        
        .dark .text-slate-800, .dark .text-slate-900 {
            color: #f1f5f9 !important;
        }

        .dark .text-slate-600, .dark .text-slate-500 {
            color: #94a3b8 !important; /* text-slate-400 */
        }

        .dark .border-slate-50, .dark .border-slate-100 {
            border-color: #334155 !important; /* border-slate-700 */
        }

        .dark select, .dark input {
            background-color: #0f172a !important; /* bg-slate-900 */
            color: #f8fafc !important;
            border-color: #334155 !important;
        }
        /* Force all input/select text to be visible (black/slate-800) and white background in light mode */
        body:not(.dark) input, body:not(.dark) select, body:not(.dark) textarea {
            color: #1e293b !important;
            background-color: #ffffff !important;
        }
        
        .dark input, .dark select, .dark textarea {
            color: #f8fafc !important;
            background-color: #0f172a !important;
            border-color: #334155 !important;
        }
        input::placeholder, textarea::placeholder {
            color: #94a3b8 !important;
        }
        /* Style for better focus states on white backgrounds */
        input:focus, select:focus, textarea:focus {
            outline: 2px solid #26A6A6;
            outline-offset: 1px;
        }

        /* Custom Scrollbar Styles */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Sidebar Scrollbar */
        .sidebar-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
        }
        .sidebar-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Utility classes */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script type="importmap">
